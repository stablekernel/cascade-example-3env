ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - test
            - staging
            - prod
        cli_version: v0.16.5-rc.1
        cli_version_sha: 148cf877cf7f78f0a66fd6407e9c5e06e601c858
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        validate:
            workflow: .github/workflows/validate.yaml
            triggers:
                - src/**
            on_failure: abort
            retries: 1
        builds:
            - name: base
              workflow: .github/workflows/build-base.yaml
              triggers: []
              retries: 2
              secrets: inherit
              permissions:
                contents: read
                id-token: write
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
              depends_on:
                - base
              auto_commits: true
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
    state:
        prod: {}
        staging:
            sha: a78ce8c59154e37d0cb435a2c4e96a820b57ea35
            version: v0.1.0-rc.0
            committed_at: "2026-07-19T14:41:01Z"
            committed_by: joshua-temple
            deploys:
                app:
                    sha: a78ce8c59154e37d0cb435a2c4e96a820b57ea35
                    version: v0.1.0-rc.0
                    deployed_at: "2026-07-19T14:41:01Z"
                    deployed_by: joshua-temple
        test:
            sha: a78ce8c59154e37d0cb435a2c4e96a820b57ea35
            version: v0.1.0-rc.0
