ci:
  config:
    schema_version: 1
    trunk_branch: main
    triggers:
      - src/**
    environments:
      - test
      - staging
      - prod
    cli_version: v0.8.0-rc.5
    cli_version_sha: 308fd8ae1beaf5bdfca0820d78028bb38589b9e4
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    validate:
      workflow: .github/workflows/validate.yaml
      triggers:
        - src/**
      on_failure: abort
      retries: 1
    builds:
      - name: base
        workflow: .github/workflows/build-base.yaml
        triggers: []
        retries: 2
        secrets: inherit
        permissions:
          contents: read
          id-token: write
      - name: app
        workflow: .github/workflows/build-app.yaml
        triggers: []
        depends_on:
          - base
        auto_commits: true
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
  state:
    test:
      sha: e4af364ab69887bd56840177a9998cc8b8be7863
