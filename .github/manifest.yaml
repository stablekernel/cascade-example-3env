ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - test
            - staging
            - prod
        cli_version: v0.5.1
        cli_version_sha: 3722c8ea2693b00fd2202ca56201c8c22f81d950
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        validate:
            workflow: .github/workflows/validate.yaml
            triggers:
                - src/**
            on_failure: abort
            retries: 1
        builds:
            - name: base
              workflow: .github/workflows/build-base.yaml
              triggers: []
              retries: 2
              secrets: inherit
              permissions:
                contents: read
                id-token: write
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
              depends_on:
                - base
              auto_commits: true
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
