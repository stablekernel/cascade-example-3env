ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - test
            - staging
            - prod
        cli_version: v0.12.1-rc.0
        cli_version_sha: 6b1448dbf1f166a8e896608e681211ef68cb27af
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        validate:
            workflow: .github/workflows/validate.yaml
            triggers:
                - src/**
            on_failure: abort
            retries: 1
        builds:
            - name: base
              workflow: .github/workflows/build-base.yaml
              triggers: []
              retries: 2
              secrets: inherit
              permissions:
                contents: read
                id-token: write
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
              depends_on:
                - base
              auto_commits: true
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
    state:
        prod: {}
        staging:
            sha: bb56f7aef26ca4f48ba7f85b75c0d3d965e9dc6b
