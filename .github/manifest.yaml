ci:
  config:
    schema_version: 1
    trunk_branch: main
    triggers:
      - src/**
    environments:
      - test
      - staging
      - prod
    cli_version: v1.1.3-rc.2
    cli_version_sha: 0ded3b4a8e8f5b895e7610465a671e861abfe70d
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    validate:
      workflow: .github/workflows/validate.yaml
      triggers:
        - src/**
      on_failure: abort
      retries: 1
    builds:
      - name: base
        workflow: .github/workflows/build-base.yaml
        triggers: []
        retries: 2
        secrets: inherit
        permissions:
          contents: read
          id-token: write
      - name: app
        workflow: .github/workflows/build-app.yaml
        triggers: []
        depends_on:
          - base
        auto_commits: true
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
  state:
    test:
      sha: 3983e6f3f7748656094d586ac0ade3393ede173e
