ci:
  config:
    schema_version: 1
    trunk_branch: main
    triggers:
      - src/**
    environments:
      - test
      - staging
      - prod
    cli_version: v0.11.0-rc.0
    cli_version_sha: 2cd506a7b3068f8a8fa6475458593129992e6f3d
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    validate:
      workflow: .github/workflows/validate.yaml
      triggers:
        - src/**
      on_failure: abort
      retries: 1
    builds:
      - name: base
        workflow: .github/workflows/build-base.yaml
        triggers: []
        retries: 2
        secrets: inherit
        permissions:
          contents: read
          id-token: write
      - name: app
        workflow: .github/workflows/build-app.yaml
        triggers: []
        depends_on:
          - base
        auto_commits: true
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
  state:
    test:
      sha: f74c5fc598a12cef22be9f760f54e9c77cb9d437
