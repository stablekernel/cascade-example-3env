ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - test
            - staging
            - prod
        cli_version: v0.14.0-dryrun.51
        cli_version_sha: f904ea561ac0ba556b251bca7ea8f54f492c7a54
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        validate:
            workflow: .github/workflows/validate.yaml
            triggers:
                - src/**
            on_failure: abort
            retries: 1
        builds:
            - name: base
              workflow: .github/workflows/build-base.yaml
              triggers: []
              retries: 2
              secrets: inherit
              permissions:
                contents: read
                id-token: write
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
              depends_on:
                - base
              auto_commits: true
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
