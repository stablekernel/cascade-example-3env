ci:
  config:
    schema_version: 1
    trunk_branch: main
    cli_version: v1.0.0-rc.11
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    environments: [test, staging, prod]
    triggers: [src/**]
    validate:
      workflow: .github/workflows/validate.yaml
      triggers: [src/**]
      on_failure: abort
      retries: 1
    builds:
      - name: base
        workflow: .github/workflows/build-base.yaml
        triggers: []
        retries: 2
        permissions:
          contents: read
          id-token: write
        secrets: inherit
      - name: app
        workflow: .github/workflows/build-app.yaml
        triggers: []
        depends_on: [base]
        auto_commits: true
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
  state: {}
