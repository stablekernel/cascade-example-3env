            deploys:
                app:
                    sha: c295fd8251f2b805399df3b9a925ad1c617fc015
                    version: v0.1.0-rc.0
                    deployed_at: "2026-07-10T09:37:50Z"
                    deployed_by: joshua-temple
        test:
