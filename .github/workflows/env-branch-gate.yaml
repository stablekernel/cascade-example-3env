name: env-branch-gate

# Satisfies the required `env-branch-gate` status check on hotfix pull requests
# into env/** branches so GitHub auto-merge fires. The hotfix apply job opens
# its pull request and enables auto-merge using the built-in Actions token; pull
# requests opened by that token never trigger pull_request or push workflows, so
# the required check can only be produced by a workflow_run job, which is exempt
# from that restriction. This job runs after every Cascade Hotfix run completes,
# finds the open hotfix pull requests, and posts a success status onto each head
# commit. Branch protection matches that status by context name on the head SHA,
# and auto-merge re-evaluates and merges.

on:
  workflow_run:
    workflows:
      - Cascade Hotfix
    types:
      - completed

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Post gate status on open hotfix pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Clean cherry-picks open a pull request labeled cascade-hotfix into an
          # env/** branch and enable auto-merge. Post the gate status onto every
          # such open pull request head so the required check turns green.
          mapfile -t HEADS < <(
            gh pr list --repo "$REPO" --state open --label cascade-hotfix \
              --json baseRefName,headRefOid,number \
              --jq '.[] | select(.baseRefName | startswith("env/")) | "\(.number) \(.headRefOid)"'
          )

          if [ "${#HEADS[@]}" -eq 0 ]; then
            echo "no open hotfix pull requests into env/** branches; nothing to gate"
            exit 0
          fi

          for entry in "${HEADS[@]}"; do
            number="${entry%% *}"
            sha="${entry##* }"
            echo "posting env-branch-gate success on PR #${number} head ${sha}"
            gh api -X POST "repos/${REPO}/statuses/${sha}" \
              -f state=success \
              -f context=env-branch-gate \
              -f description="env-branch PR gate ok"
          done
