name: validate
on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
      sha:
        required: false
        type: string
      version:
        required: false
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Stub validate
        env:
          # Abort-path test hook. The scenario suite sets the repository
          # variable VALIDATE_FAIL_SENTINEL to a unique value before the
          # abort-path stage, then clears it. When it is set, validate exits
          # non-zero so the suite can prove on_failure: abort skips every
          # downstream build/deploy and fails the run. The normal path leaves
          # the variable empty and this stub passes.
          FAIL_SENTINEL: ${{ vars.VALIDATE_FAIL_SENTINEL }}
        run: |
          echo "validating environment=${{ inputs.environment }} sha=${{ inputs.sha }} version=${{ inputs.version }}"
          if [ -n "$FAIL_SENTINEL" ]; then
            echo "::error::validate sentinel set (${FAIL_SENTINEL}); failing to exercise on_failure: abort"
            exit 1
          fi
          sleep 1
