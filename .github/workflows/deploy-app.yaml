name: deploy-app
on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
      sha:
        required: false
        type: string
      version:
        required: false
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Stub deploy app
        run: |
          echo "deploy app environment=${{ inputs.environment }} sha=${{ inputs.sha }} version=${{ inputs.version }} dry_run=${{ inputs.dry_run }}"
          sleep 2
